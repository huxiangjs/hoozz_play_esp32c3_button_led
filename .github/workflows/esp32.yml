name: ESP32 CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    # Checkout the repository to the GitHub Actions runner
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        path: esp32-build
        fetch-depth: 1

    # Install jq
    - name: Install jq
      run: sudo apt-get install -y jq

    # Get ESP-IDF
    - name: Get ESP-IDF
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        ref: release/v5.2
        fetch-depth: 1
        path: esp-idf

    # Cache ESP-IDF
    - name: Cache ESP-IDF
      uses: actions/cache@v3
      with:
        path: |
          esp-idf
          ~/.espressif
        key: ${{ runner.os }}-esp-idf-${{ hashFiles('esp-idf/.git/refs/heads/release/v5.2') }}
        restore-keys: |
          ${{ runner.os }}-esp-idf-

    # Install ESP-IDF
    - name: Install ESP-IDF
      run: |
        cd esp-idf/
        ./install.sh

    # Debug: what makes the tree dirty in CI? (temporary)
    - name: Debug git state (before build)
      run: |
        cd esp32-build
        echo "=== git version ==="
        git --version
        echo "=== eol/mode git config (all scopes) ==="
        git config --show-origin --list | grep -iE "autocrlf|core\.eol|core\.filemode|safedirectory" || echo "(none)"
        echo "=== git status (repo root) ==="
        git status
        echo "=== git status --porcelain (repo root) ==="
        git status --porcelain; echo "[end]"
        echo "=== git status --porcelain (MCU/main) ==="
        git -C MCU/main status --porcelain; echo "[end]"
        echo "=== untracked (repo root) ==="
        git ls-files --others --exclude-standard; echo "[end]"
        echo "=== diff (repo root) ==="
        git diff; echo "[end]"
        echo "=== submodule status ==="
        git submodule status
        echo "=== files on disk under MCU (maxdepth 1) ==="
        find MCU -maxdepth 1 -type f | sort; echo "[end]"
        echo "=== files on disk under MCU/main (excluding submodule) ==="
        find MCU/main -maxdepth 1 -type f | sort; echo "[end]"
        echo "=== entries under MCU/main/esp32-common (top level) ==="
        find MCU/main/esp32-common -maxdepth 1 | sort; echo "[end]"

    # Run ESP32 build command
    - name: Build
      run: |
        cd esp-idf/
        . ./export.sh
        cd -
        cd esp32-build/MCU
        idf.py build
        cd build
        project_name=$(jq -r '.project_name' project_description.json)
        # The flash pieces (see MCU/partitions.csv):
        #   0x0000 bootloader.bin  0x8000 partition-table.bin
        #   0xf000 ota_data_initial.bin  0x20000 ota_0 (app)  0x1A0000 ota_1
        # ota_file names the app bin the OTA update flashes (the app reads
        # it from the release zip to pick the firmware image)
        echo "$project_name.bin" > ota_file
        zip release.zip bootloader/bootloader.bin flash_args partition_table/partition-table.bin ota_data_initial.bin ota_file $project_name.bin

    # Debug: what makes the tree dirty in CI? (temporary)
    - name: Debug git state (after build)
      run: |
        cd esp32-build
        echo "=== git status --porcelain (repo root) ==="
        git status --porcelain; echo "[end]"
        echo "=== git status --porcelain (MCU/main) ==="
        git -C MCU/main status --porcelain; echo "[end]"
        echo "=== sdkconfig diff ==="
        git diff MCU/sdkconfig | head -40; echo "[end]"
        echo "=== git_version.h (what got embedded) ==="
        cat MCU/build/include/git_version.h || echo "(missing)"

    # Check tag
    - name: Check if the event is a tag push
      id: check_tag_push
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "Is tag push"
          echo "IS_TAG_PUSH=true" >> $GITHUB_OUTPUT
        else
          echo "IS_TAG_PUSH=false" >> $GITHUB_OUTPUT
        fi

    # Create release
    - name: Create Release
      if: steps.check_tag_push.outputs.IS_TAG_PUSH == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    # Upload binary file to release
    - name: Upload Release Asset
      if: steps.check_tag_push.outputs.IS_TAG_PUSH == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: esp32-build/MCU/build/release.zip
        asset_name: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip
        asset_content_type: application/zip
